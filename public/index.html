<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloodSense — Guayaquil</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--surface-muted:#f8fafc;--line:#d8e0e8;--tx:#172536;--mut:#5d6b7b;--info:#1769aa;--info-soft:#e8f2fa;--warn:#9a6400;--warn-soft:#fff5d8;--bad:#b42332;--bad-soft:#fff0f1;--ok:#18794e;--ok-soft:#e9f7ef;--ink:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Arial,Calibri,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:3px solid #4b9bd1;outline-offset:2px}
header{display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo,h1,h2,h3{font-family:"TypeOne",Georgia,"Times New Roman",serif}.logo{font-weight:750;font-size:20px;letter-spacing:-.02em;color:var(--tx)}.logo b{color:var(--info)}
.sp{flex:1}.clock{color:var(--mut);font-size:13px}
button,select,input,textarea{font:inherit}
.btn{background:var(--surface);color:var(--tx);border:1px solid #b9c6d3;border-radius:6px;padding:7px 12px;cursor:pointer;min-height:38px;font-weight:600}
.btn:hover{border-color:var(--info);background:var(--info-soft)}.btn.pri{background:var(--info);color:#fff;border-color:var(--info);font-weight:700}
.btn.sos{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
#demo{background:var(--warn-soft);color:#6a4700;border-bottom:1px solid #e8c66c;text-align:center;font-weight:700;padding:6px 12px;font-size:13px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#map{height:100%;min-height:300px;background:#dfe8ef}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--surface)}
nav button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px 5px;cursor:pointer;font-size:13px}
nav button[aria-selected=true]{color:var(--info);border-bottom-color:var(--info);font-weight:700;background:var(--info-soft)}
nav button.s{color:var(--bad)}
#panel{overflow:auto;padding:18px;flex:1}
h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}h3{margin:16px 0 7px;font-size:15px}
.card{background:var(--surface-muted);border:1px solid var(--line);border-radius:7px;padding:12px 13px;margin:9px 0}
.mut{color:var(--mut);font-size:13px;line-height:1.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:12px;font-weight:700;border:1px solid}
.t-verified,.t-resolved{color:var(--ok);border-color:#8bc9aa;background:var(--ok-soft)}.t-awaiting,.t-corroborated,.t-moderate{color:var(--warn);border-color:#e3c36c;background:var(--warn-soft)}
.t-high,.t-critical,.t-sev{color:var(--bad);border-color:#e3a0a8;background:var(--bad-soft)}.t-low,.t-insufficient,.t-demo{color:var(--info);border-color:#9fc6e1;background:var(--info-soft)}
.t-rejected{color:var(--mut);border-color:#b9c6d3;background:#f1f3f5}
label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut);font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
input,select,textarea{width:100%;background:var(--surface);color:var(--tx);border:1px solid #b9c6d3;border-radius:6px;padding:9px}
input:focus,select:focus,textarea:focus{border-color:var(--info);outline:2px solid #b8d7eb;outline-offset:1px}
.score{font-size:32px;font-weight:750}.bar{height:8px;background:#e6ebf0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.err{color:var(--bad)}.good{color:var(--ok)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:12px}.legend i{width:12px;height:12px;display:inline-block;border-radius:3px}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff}
.fac{width:18px;height:18px;border-radius:4px;border:2px solid #fff;background:var(--info);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:14px}
.stale{background:var(--warn-soft);color:#6a4700;border:1px solid #e3c36c;padding:8px 10px;border-radius:6px;font-size:13px;margin:7px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:2000;background:var(--tx);color:#fff;border:1px solid #405367;border-radius:6px;padding:10px 14px;max-width:92vw;display:flex;gap:10px;align-items:center}
@media(max-width:860px){body{overflow:auto}main{grid-template-columns:1fr;grid-template-rows:minmax(280px,42vh) minmax(0,1fr);min-height:calc(100vh - 100px)}aside{border-left:0;border-top:1px solid var(--line);min-height:420px}nav{grid-template-columns:repeat(5,1fr);order:2;border-top:1px solid var(--line);border-bottom:0}aside{flex-direction:column}#panel{order:1}.clock{display:none}}
@media(max-width:480px){header{padding:8px 12px;gap:9px;flex-wrap:nowrap}.logo{font-size:18px}#city{display:none}#citySelect{flex:1;min-width:0;max-width:none;font-size:12px;padding:6px}.sp{display:none}.net{font-size:11px}nav button{font-size:11px;padding:9px 2px}.btn{min-height:36px;padding:7px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo">Flood<b>Sense</b></div><span class="mut" id="city">Guayaquil</span><label for="citySelect" class="sr-only">Demonstration city</label><select id="citySelect" aria-label="Demonstration city"><option value="gye">Guayaquil, Ecuador</option><option value="maa">Chennai, Tamil Nadu, India</option></select><span class="sp"></span>
<span class="clock" id="clock"></span><span id="net" class="tag t-low">online</span>
<button class="btn" id="lang" aria-label="Language">EN</button><span id="who" class="mut"></span></header>
<div id="demo" role="alert">DEMO DATA — NOT FOR REAL EMERGENCY USE · DATOS DE DEMOSTRACIÓN — NO USAR EN EMERGENCIAS REALES</div>
<main><div id="map" role="application" aria-label="Map"></div>
<aside><nav id="nav" role="tablist"></nav><section id="panel" aria-live="polite"></section></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script></body></html>
