<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloodSense — Guayaquil</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a2b;--panel:#12263d;--panel2:#183250;--line:#2a4766;--tx:#e8f0f8;--mut:#9fb3c8;--info:#38bdf8;--warn:#fbbf24;--bad:#f43f5e;--ok:#34d399;--light:#f5f8fb;--ink:#0b1a2b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#08121f;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.02em}.logo b{color:var(--info)}
.sp{flex:1}.clock{color:var(--mut);font-size:14px}
button,select,input,textarea{font:inherit}
.btn{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--info)}.btn.pri{background:var(--info);color:var(--ink);border-color:var(--info);font-weight:700}
.btn.sos{background:var(--bad);border-color:#fff;color:#fff;font-weight:700}.btn.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}
#demo{background:var(--warn);color:#1a1200;text-align:center;font-weight:700;padding:5px;font-size:14px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#map{height:100%;min-height:300px;background:#0e2238}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:1;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:12px 10px;cursor:pointer}
nav button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--info);font-weight:700}
nav button.s{color:#ff9aa9}
#panel{overflow:auto;padding:14px;flex:1}
h2{margin:0 0 8px;font-size:19px}h3{margin:14px 0 6px;font-size:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;border:1px solid}
.t-verified,.t-resolved{color:var(--ok);border-color:var(--ok)}.t-awaiting,.t-corroborated,.t-moderate{color:var(--warn);border-color:var(--warn)}
.t-high,.t-critical,.t-sev{color:var(--bad);border-color:var(--bad)}.t-low,.t-insufficient,.t-demo{color:var(--info);border-color:var(--info)}
.t-rejected{color:var(--mut);border-color:var(--mut)}
label{display:block;margin:10px 0 3px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;background:#0b1a2b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px}
.score{font-size:34px;font-weight:700}.bar{height:8px;background:#0b1a2b;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.err{color:#ff9aa9}.good{color:var(--ok)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:13px}.legend i{width:12px;height:12px;display:inline-block;border-radius:3px}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff}
.fac{width:18px;height:18px;border-radius:4px;border:2px solid #fff;background:var(--info);color:var(--ink);font-size:11px;font-weight:700;text-align:center;line-height:14px}
.stale{background:#3b2f06;border:1px solid var(--warn);padding:6px 10px;border-radius:8px;font-size:14px;margin:6px 0}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:42vh minmax(0,1fr)}aside{border-left:0;border-top:1px solid var(--line)}
 nav{order:2;border-top:1px solid var(--line);border-bottom:0}aside{flex-direction:column}#panel{order:1}.clock{display:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:2000;background:#08121f;border:1px solid var(--info);border-radius:10px;padding:10px 14px;max-width:92vw;display:flex;gap:10px;align-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo">Flood<b>Sense</b></div><span class="mut" id="city">Guayaquil</span><span class="sp"></span>
<span class="clock" id="clock"></span><span id="net" class="tag t-low">online</span>
<button class="btn" id="lang" aria-label="Language">EN</button><span id="who" class="mut"></span></header>
<div id="demo" role="alert">DEMO DATA — NOT FOR REAL EMERGENCY USE · DATOS DE DEMOSTRACIÓN — NO USAR EN EMERGENCIAS REALES</div>
<main><div id="map" role="application" aria-label="Map"></div>
<aside><nav id="nav" role="tablist"></nav><section id="panel" aria-live="polite"></section></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script></body></html>
